AWSTemplateFormatVersion: '2010-09-09'
Description: Cognito identity resources for the academic donations application

Parameters:
  DomainPrefix:
    Type: String
    MinLength: 1
    MaxLength: 63
    AllowedPattern: '[a-z0-9](?:[a-z0-9-]*[a-z0-9])?'
    Description: Unique Cognito domain prefix chosen with P1
  CallbackURLs:
    Type: CommaDelimitedList
    Description: Exact approved callback URLs; HTTPS except localhost development
  LogoutURLs:
    Type: CommaDelimitedList
    Description: Exact approved logout URLs; HTTPS except localhost development

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: donations-academic
      UserPoolTier: LITE
      UsernameConfiguration:
        CaseSensitive: false
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 1
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: admin_only
            Priority: 1

  ResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: api
      Name: Donations API
      Scopes:
        - ScopeName: projects.write
          ScopeDescription: Project management; backend also requires GESTOR
        - ScopeName: donations.write
          ScopeDescription: Donation changes; backend also requires DONANTE and ownership
        - ScopeName: donations.read
          ScopeDescription: Own donations; backend also requires DONANTE

  PublicClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: donations-react
      GenerateSecret: false
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - api/projects.write
        - api/donations.write
        - api/donations.read
      CallbackURLs: !Ref CallbackURLs
      LogoutURLs: !Ref LogoutURLs
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH

  Domain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref DomainPrefix
      ManagedLoginVersion: 1

  DonorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: DONANTE
  ManagerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: GESTOR
  AuditorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: AUDITOR

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  ClientId:
    Value: !Ref PublicClient
  Issuer:
    Value: !Sub https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPool}
  LoginDomain:
    Value: !Sub https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com
