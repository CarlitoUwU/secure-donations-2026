AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Plataforma de donaciones seguras (Fundacion AQP Solidaria)

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - W1028 # Falso positivo en macro SAM: ruta condicional de simulación en HttpApi

Parameters:
  Environment:
    Type: String
    Default: academic
    AllowedValues: [academic, dev]
    Description: Deployment environment (academic enables simulated donations)
  ApiAudience:
    Type: String
    Default: https://api.donaciones-academic.local
    Description: Expected audience for API Gateway JWT Authorizer (matches VITE_API_AUDIENCE)
  # Cognito
  DomainPrefix:
    Type: String
    Default: aqp-solidaria-2026
    MinLength: 1
    MaxLength: 63
    AllowedPattern: '[a-z0-9](?:[a-z0-9-]*[a-z0-9])?'
    Description: Unique Cognito domain prefix chosen with P1
  CallbackURLs:
    Type: CommaDelimitedList
    Default: http://localhost:5173/auth/callback
    Description: Exact approved callback URLs; HTTPS except localhost development
  LogoutURLs:
    Type: CommaDelimitedList
    Default: http://localhost:5173/
    Description: Exact approved logout URLs; HTTPS except localhost development

Conditions:
  IsAcademic: !Equals [!Ref Environment, academic]

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 256
    CodeUri: ../
    Environment:
      Variables:
        STAGE: !Ref Environment
        PROJECTS_TABLE: !Ref ProjectsTable
        DONATIONS_TABLE: !Ref DonationsTable
        IDEMPOTENCY_TABLE: !Ref IdempotencyTable
        AUDIT_EVENTS_TABLE: !Ref AuditEventsTable
        COGNITO_CLIENT_ID: !Ref PublicClient

Resources:
  # ------------------------------------------------------------
  # API Gateway HTTP API (P1 - Integracion con CORS, Auth & Throttling)
  # ------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
          - http://localhost:5173
          - http://127.0.0.1:5173
          - !Sub https://${FrontendDistribution.DomainName}
        AllowHeaders:
          - Authorization
          - Content-Type
          - Idempotency-Key
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPool}
              audience:
                - !Ref ApiAudience

  # ------------------------------------------------------------
  # DynamoDB Tables (P3 - API y Datos)
  # ------------------------------------------------------------
  ProjectsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub donaciones-${Environment}-projects
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: projectId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: projectId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-createdAt
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  DonationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub donaciones-${Environment}-donations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: donationId
          AttributeType: S
        - AttributeName: donorSub
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: donationId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: donorSub-createdAt
          KeySchema:
            - AttributeName: donorSub
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub donaciones-${Environment}-idempotency
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  AuditEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub donaciones-${Environment}-audit-events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventType
          AttributeType: S
        - AttributeName: sortKey
          AttributeType: S
      KeySchema:
        - AttributeName: eventType
          KeyType: HASH
        - AttributeName: sortKey
          KeyType: RANGE

  # ------------------------------------------------------------
  # Cognito Identity Resources (P2 - Identidad y Seguridad)
  # ------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub donations-${Environment}
      UserPoolTier: LITE
      UsernameConfiguration:
        CaseSensitive: false
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 1
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: admin_only
            Priority: 1

  ResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: api
      Name: Donations API
      Scopes:
        - ScopeName: projects.write
          ScopeDescription: Project management; backend also requires GESTOR
        - ScopeName: donations.write
          ScopeDescription: Donation changes; backend also requires DONANTE and ownership
        - ScopeName: donations.read
          ScopeDescription: Own donations; backend also requires DONANTE

  PublicClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: donations-react
      GenerateSecret: false
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - api/projects.write
        - api/donations.write
        - api/donations.read
      CallbackURLs:
        - !Select [0, !Ref CallbackURLs]
        - !Sub https://${FrontendDistribution.DomainName}/auth/callback
      LogoutURLs:
        - !Select [0, !Ref LogoutURLs]
        - !Sub https://${FrontendDistribution.DomainName}/
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH

  Domain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref DomainPrefix
      ManagedLoginVersion: 1

  DonorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: DONANTE

  ManagerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: GESTOR

  AuditorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: AUDITOR

  # ------------------------------------------------------------
  # Lambda Functions (P3 - API y Datos, empaquetado por P1)
  # ------------------------------------------------------------

  # 1. List Projects (Publica - GET /v1/projects)
  ListProjectsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub donaciones-${Environment}-list-projects
      Handler: backend/dist/handler.listProjects
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !GetAtt ProjectsTable.Arn
                - !Sub ${ProjectsTable.Arn}/index/status-createdAt
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/projects
            Method: GET
            PayloadFormatVersion: '2.0'
            Auth:
              Authorizer: NONE

  # 2. Get Project (Publica - GET /v1/projects/{projectId})
  GetProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub donaciones-${Environment}-get-project
      Handler: backend/dist/handler.getProject
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                - !GetAtt ProjectsTable.Arn
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/projects/{projectId}
            Method: GET
            PayloadFormatVersion: '2.0'
            Auth:
              Authorizer: NONE

  # 3. Project Stats (Publica - GET /v1/projects/{projectId}/stats)
  ProjectStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub donaciones-${Environment}-project-stats
      Handler: backend/dist/handler.projectStats
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                - !GetAtt ProjectsTable.Arn
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/projects/{projectId}/stats
            Method: GET
            PayloadFormatVersion: '2.0'
            Auth:
              Authorizer: NONE

  # 4. Create Project (Privada - POST /v1/projects - GESTOR)
  CreateProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub donaciones-${Environment}-create-project
      Handler: backend/dist/handler.createProject
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                - !GetAtt ProjectsTable.Arn
                - !GetAtt AuditEventsTable.Arn
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/projects
            Method: POST
            PayloadFormatVersion: '2.0'
            Auth:
              AuthorizationScopes:
                - api/projects.write

  # 5. Edit Project (Privada - PATCH /v1/projects/{projectId} - GESTOR)
  EditProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub donaciones-${Environment}-edit-project
      Handler: backend/dist/handler.editProject
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource:
                - !GetAtt ProjectsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                - !GetAtt AuditEventsTable.Arn
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/projects/{projectId}
            Method: PATCH
            PayloadFormatVersion: '2.0'
            Auth:
              AuthorizationScopes:
                - api/projects.write

  # 6. Publish Project (Privada - PATCH /v1/projects/{projectId}/publish - GESTOR)
  PublishProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub donaciones-${Environment}-publish-project
      Handler: backend/dist/handler.publishProject
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource:
                - !GetAtt ProjectsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                - !GetAtt AuditEventsTable.Arn
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/projects/{projectId}/publish
            Method: PATCH
            PayloadFormatVersion: '2.0'
            Auth:
              AuthorizationScopes:
                - api/projects.write

  # 7. Create Donation (Privada - POST /v1/donations - DONANTE)
  CreateDonationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub donaciones-${Environment}-create-donation
      Handler: backend/dist/handler.createDonation
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                - !GetAtt ProjectsTable.Arn
                - !GetAtt IdempotencyTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:ConditionCheckItem
              Resource:
                - !GetAtt ProjectsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                - !GetAtt DonationsTable.Arn
                - !GetAtt IdempotencyTable.Arn
                - !GetAtt AuditEventsTable.Arn
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/donations
            Method: POST
            PayloadFormatVersion: '2.0'
            Auth:
              AuthorizationScopes:
                - api/donations.write

  # 8. Simulate Donation (Privada - POST /v1/donations/{donationId}/simulate - DONANTE propietario - Solo academic)
  SimulateDonationFunction:
    Type: AWS::Serverless::Function
    Condition: IsAcademic
    Properties:
      FunctionName: !Sub donaciones-${Environment}-simulate-donation
      Handler: backend/dist/handler.simulateDonation
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt DonationsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt ProjectsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                - !GetAtt AuditEventsTable.Arn
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/donations/{donationId}/simulate
            Method: POST
            PayloadFormatVersion: '2.0'
            Auth:
              AuthorizationScopes:
                - api/donations.write

  # 9. My Donations (Privada - GET /v1/donations/me - DONANTE)
  MyDonationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub donaciones-${Environment}-my-donations
      Handler: backend/dist/handler.myDonations
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !GetAtt DonationsTable.Arn
                - !Sub ${DonationsTable.Arn}/index/donorSub-createdAt
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/donations/me
            Method: GET
            PayloadFormatVersion: '2.0'
            Auth:
              AuthorizationScopes:
                - api/donations.read

  # 10. Get Donation (Privada - GET /v1/donations/{donationId} - DONANTE propietario)
  GetDonationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub donaciones-${Environment}-get-donation
      Handler: backend/dist/handler.getDonation
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                - !GetAtt DonationsTable.Arn
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/donations/{donationId}
            Method: GET
            PayloadFormatVersion: '2.0'
            Auth:
              AuthorizationScopes:
                - api/donations.read

  # ------------------------------------------------------------
  # Publicacion de Frontend (P1 - S3 Privado + CloudFront OAC + CSP/HSTS)
  # ------------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub donaciones-${Environment}-frontend-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub donaciones-${Environment}-frontend-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub donaciones-${Environment}-security-headers
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix} https://cognito-idp.${AWS::Region}.${AWS::URLSuffix} https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self';"
            Override: true

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}

Outputs:
  ApiUrl:
    Description: Base HTTPS URL of the HTTP API (includes stage)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}
  ApiAudienceValue:
    Description: Expected audience for frontend (VITE_API_AUDIENCE)
    Value: !Ref ApiAudience
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  ClientId:
    Description: Cognito App Client ID (Public client for React)
    Value: !Ref PublicClient
  Issuer:
    Description: Cognito Token Issuer URL
    Value: !Sub https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPool}
  LoginDomain:
    Description: Cognito Hosted UI Domain URL
    Value: !Sub https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com
  ProjectsTableName:
    Description: DynamoDB Projects Table Name
    Value: !Ref ProjectsTable
  DonationsTableName:
    Description: DynamoDB Donations Table Name
    Value: !Ref DonationsTable
  IdempotencyTableName:
    Description: DynamoDB Idempotency Table Name
    Value: !Ref IdempotencyTable
  AuditEventsTableName:
    Description: DynamoDB Audit Events Table Name
    Value: !Ref AuditEventsTable
  FrontendUrl:
    Description: CloudFront HTTPS URL for the React SPA
    Value: !Sub https://${FrontendDistribution.DomainName}
  FrontendBucketName:
    Description: S3 Bucket Name for frontend build deployment
    Value: !Ref FrontendBucket
  DistributionId:
    Description: CloudFront Distribution ID for invalidation
    Value: !Ref FrontendDistribution
